
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

  <!-- TODO 1: center this wrapper and add space on top and bottom -->
  <div class="container py-5">

    <!-- TODO 3: put the title and greeting on one line -->
    <div class="d-flex justify-content-between align-items-center mb-3">

      <!-- TODO 3: size-6 heading, bold, primary color -->
      <h1 class="fs-6 fw-bold text-primary">My Dashboard</h1>
      <span class="small">Hello, Admin</span>
    </div>

    <!-- TODO 3: lead paragraph in a muted color -->
    <p class="lead text-secondary">Welcome! Here is a summary of your records.</p>

    <!-- TODO 2: make this a row -->
    <div class="row">

      <!-- TODO 2: responsive column and styled box -->
      <div class="col-12 col-md-6 col-lg-4">
        <div class="border p-3 mb-3">Total: 120</div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="border p-3 mb-3">Pending: 15</div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="border p-3 mb-3">Done: 105</div>
      </div>

    </div>

    <!-- TODO 5: make the table scroll sideways on small screens -->
    <div class="table-responsive">

      <!-- TODO 5: striped rows and hover effect -->
      <table class="table table-striped table-hover">
        <tr class="table-light">
          <th>Name</th>
          <th>Status</th>
          <th>Date</th>
        </tr>

        <!-- TODO 5: highlight this row with the warning color -->
        <tr class="table-warning">
          <td>Ana</td>
          <td>Pending</td>
          <td>Oct 1</td>
        </tr>

        <tr>
          <td>Ben</td>
          <td>Done</td>
          <td>Oct 2</td>
        </tr>

        <tr>
          <td>Cara</td>
          <td>Done</td>
          <td>Oct 3</td>
        </tr>
      </table>
    </div>

    <!-- TODO 4: buttons in a row with gap and space above -->
    <div class="d-flex align-items-center gap-2 mt-4">

      <!-- TODO 4: large primary button -->
      <button class="btn btn-primary btn-lg">Add New</button>

      <!-- TODO 4: success button -->
      <button class="btn btn-success">Edit</button>

      <!-- TODO 4: danger button -->
      <button class="btn btn-danger">Delete</button>

      <!-- TODO 4: disabled secondary button -->
      <button class="btn btn-secondary" disabled>Export</button>

    </div>
  </div>

</body>

</html>
